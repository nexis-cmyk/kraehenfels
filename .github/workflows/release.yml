name: iOS release IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen
      - name: Generate project
        run: cd app && xcodegen generate
      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "app_version=${GITHUB_REF_NAME#v}" | sed 's/-.*//' >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "app_version=${{ inputs.version }}" | sed 's/-.*//' >> "$GITHUB_OUTPUT"
          fi
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project app/Kraehenfels.xcodeproj \
            -scheme Kraehenfels \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            MARKETING_VERSION="${{ steps.release.outputs.app_version }}" \
            CURRENT_PROJECT_VERSION=4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Kraehenfels.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Kraehenfels.ipa" Payload
      - name: Prepare AltStore feed
        run: |
          python3 tools/update_altstore_feed.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ steps.release.outputs.tag }}" \
            --ipa Kraehenfels.ipa \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.release.outputs.tag }}/Kraehenfels.ipa" \
            --output altstore/source.generated.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            Kraehenfels.ipa
            altstore/source.generated.json
          generate_release_notes: true
