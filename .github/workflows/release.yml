name: iPad release IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without a leading v"
        required: true
        default: "5.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen
      - name: Generate project
        run: cd app && xcodegen generate
      - name: Validate AltStore feed template
        run: python3 tools/validate_altstore_feed.py altstore/source.json
      - name: Resolve release tag
        id: release
        env:
          WORKFLOW_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="${WORKFLOW_VERSION#v}"
            release_tag="v${release_version}"
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version: $release_version" >&2
            exit 1
          fi
          app_version="${release_version%%-*}"
          build_version="$(sed -nE 's/^[[:space:]]+CURRENT_PROJECT_VERSION:[[:space:]]*"([0-9]+)".*$/\1/p' app/project.yml | head -n 1)"
          if [[ -z "$build_version" ]]; then
            echo "Could not read CURRENT_PROJECT_VERSION from app/project.yml" >&2
            exit 1
          fi
          {
            echo "tag=$release_tag"
            echo "version=$release_version"
            echo "app_version=$app_version"
            echo "build_version=$build_version"
          } >> "$GITHUB_OUTPUT"
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project app/Kraehenfels.xcodeproj \
            -scheme Kraehenfels \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            MARKETING_VERSION="${{ steps.release.outputs.app_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.release.outputs.build_version }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          test -d "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Kraehenfels.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Kraehenfels.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Kraehenfels.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/Kraehenfels.ipa"
          test -s "$GITHUB_WORKSPACE/Kraehenfels.ipa"
      - name: Prepare AltStore feed
        run: |
          python3 tools/update_altstore_feed.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ steps.release.outputs.tag }}" \
            --ipa Kraehenfels.ipa \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.release.outputs.tag }}/Kraehenfels.ipa" \
            --output altstore/source.generated.json
          python3 tools/validate_altstore_feed.py altstore/source.generated.json --ipa Kraehenfels.ipa
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            Kraehenfels.ipa
            altstore/source.generated.json
          generate_release_notes: true
