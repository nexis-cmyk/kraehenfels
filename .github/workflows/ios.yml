name: iOS build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate content and guided flow
        run: |
          python3 tools/validate_guided_flow.py
          python3 tools/validate_altstore_feed.py altstore/source.json
      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen
      - name: Generate project
        run: cd app && xcodegen generate
      - name: Build iPad app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project app/Kraehenfels.xcodeproj \
            -scheme Kraehenfels \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Report iPad build errors
        if: steps.build.outputs.status != '0'
        run: |
          grep -E 'error:|fatal error:' "$RUNNER_TEMP/xcodebuild.log" | tail -n 80 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
      - name: Package iPad Simulator app for Appetize
        run: |
          APP_PATH="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Kraehenfels.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/appetize"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/appetize/Kraehenfels-simulator.zip"
      - name: Upload Appetize-ready iPad simulator build
        uses: actions/upload-artifact@v4
        with:
          name: kraehenfels-ipad-simulator-app
          path: ${{ runner.temp }}/appetize/Kraehenfels-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Run iPad unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and "iPad Pro" in device["name"] and "11" in device["name"]))')
          xcodebuild \
            -project app/Kraehenfels.xcodeproj \
            -scheme Kraehenfels \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
