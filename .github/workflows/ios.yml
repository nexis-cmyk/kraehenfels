name: iOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate content and guided flow
        run: |
          python3 tools/validate_guided_flow.py
      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen
      - name: Generate project
        run: cd app && xcodegen generate
      - name: Build iOS app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project app/Kraehenfels.xcodeproj \
            -scheme Kraehenfels \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Report iOS build errors
        if: steps.build.outputs.status != '0'
        run: |
          grep -E 'error:|fatal error:' "$RUNNER_TEMP/xcodebuild.log" | tail -n 80 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
      - name: Run iOS unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          xcodebuild \
            -project app/Kraehenfels.xcodeproj \
            -scheme Kraehenfels \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
