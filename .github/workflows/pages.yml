name: Publish web GM test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "web/**"
      - "content/manifest.json"
      - "app/Kraehenfels/Resources/**"
      - "tools/build_web_preview.py"
      - "altstore/source.json"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror IPA for reliable AltStore downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          asset_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[] | select(.name == "Kraehenfels.ipa") | .url')"
          test -n "$asset_url"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$asset_url" -o web/Kraehenfels.ipa
          # The native bundle is intentionally lean after removing legacy
          # resources; validate a non-trivial IPA instead of assuming a
          # historical 100 MB size.
          test "$(stat -c%s web/Kraehenfels.ipa)" -gt 50000000
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
