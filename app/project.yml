name: Kraehenfels
options:
  bundleIdPrefix: de.kraehenfels
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  Kraehenfels:
    type: application
    platform: iOS
    sources:
      - path: Kraehenfels
        excludes:
          - Resources/**
      - path: Kraehenfels/Resources/Assets.xcassets
        buildPhase: resources
      - path: Kraehenfels/Resources/manifest.json
        buildPhase: resources
      - path: Kraehenfels/Resources/Audio
        type: folder
        buildPhase: resources
      - path: Kraehenfels/Resources/Art
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kraehenfels.spielleitung
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Krähenfels
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - KraehenfelsTests
  KraehenfelsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KraehenfelsTests
    dependencies:
      - target: Kraehenfels
