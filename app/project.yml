name: Kraehenfels
options:
  bundleIdPrefix: de.kraehenfels
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  Kraehenfels:
    type: application
    platform: iOS
    sources:
      - path: Kraehenfels
        excludes:
          - Resources/**
      - path: Kraehenfels/Resources/Assets.xcassets
        buildPhase: resources
      - path: Kraehenfels/Resources/manifest.json
        buildPhase: resources
      - path: Kraehenfels/Resources/Audio
        type: folder
        buildPhase: resources
      - path: Kraehenfels/Resources/Art
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
    info:
      path: Kraehenfels/Resources/Info.plist
      properties:
        CFBundleDisplayName: Krähenfels
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - de.kraehenfels.spielleitung
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kraehenfels.spielleitung
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - KraehenfelsTests
  KraehenfelsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KraehenfelsTests
    dependencies:
      - target: Kraehenfels
