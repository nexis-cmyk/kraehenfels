<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07110d" />
    <meta name="description" content="Krähenfels: Die letzte Kutsche · lokaler Spielleiter-Leitstand für iPad und Desktop-Vorschau." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.png" />
    <link rel="apple-touch-icon" href="./assets/icon.png" />
    <link rel="stylesheet" href="./styles.css?v=4.1.5" />
    <title>Krähenfels · Leitstand</title>
  </head>
  <body>
    <a class="skip-link" href="#scene-content">Zum Szeneninhalt springen</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Szenensteuerung">
        <div class="brand-lockup">
          <img src="./assets/icon.png" alt="" class="brand-icon" />
          <div>
            <p class="brand-kicker">Spielleitung</p>
            <h1>Krähenfels</h1>
            <p class="brand-subtitle">Die letzte Kutsche</p>
          </div>
        </div>

        <section class="progress-block" aria-labelledby="progress-title">
          <div class="section-heading">
            <h2 id="progress-title">Fortschritt</h2>
            <span id="progress-count" class="counter" aria-live="polite">0 / 9</span>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
        </section>

        <nav id="scene-nav" class="scene-nav" aria-label="Szenen"></nav>

        <div class="sidebar-actions" aria-hidden="true"></div>
      </aside>

      <main id="scene-content" class="main-content" tabindex="-1">
        <header class="topbar" aria-label="Krähenfels-Navigation">
          <button id="topbar-back" class="topbar-back" data-action="home" type="button" hidden aria-label="Zur Startseite">
            <span aria-hidden="true">‹</span><span>Krähenfels</span>
          </button>
          <div class="topbar-title">
            <p id="screen-title">Krähenfels</p>
            <p id="audio-status" class="audio-status" role="status">Audio bereit.</p>
          </div>
          <div class="topbar-actions">
            <button id="topbar-menu" class="topbar-menu" data-action="menu" type="button" aria-label="Mehr Optionen" aria-expanded="false">•••</button>
            <div id="topbar-menu-panel" class="topbar-menu-panel" hidden>
              <button id="audio-test" class="menu-action" type="button">Audio testen</button>
              <button id="reset-progress" class="menu-action menu-action-danger" type="button">Fortschritt zurücksetzen</button>
            </div>
            <button id="stop-all" class="button button-stop topbar-stop" type="button">Alle Sounds stoppen</button>
          </div>
        </header>

        <div id="app" aria-live="polite"></div>
      </main>
    </div>

    <nav class="transport-bar" aria-label="Schnellsteuerung">
      <button class="transport-button" data-action="motif" type="button"><span aria-hidden="true">▶</span><span>Motiv</span></button>
      <button class="transport-button" data-action="read-aloud" type="button"><span aria-hidden="true">❝</span><span>Vorlesen</span></button>
      <button id="transport-stop" class="transport-stop" type="button"><span aria-hidden="true">■</span><span>STOP</span></button>
    </nav>

    <template id="loading-template">
      <section class="loading-state" aria-busy="true">
        <p>Lade den Leitstand …</p>
      </section>
    </template>

    <script type="module" src="./js/app.js?v=4.1.5"></script>
  </body>
</html>
